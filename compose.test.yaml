# Testdatenbank für Integrations- und E2E-Tests (Daten im RAM, wird bei jedem Start leer angelegt).
#   docker compose -f compose.test.yaml up -d --wait
#   TEST_DATABASE_URL=postgresql://geoimport:test@127.0.0.1:55434/geoimport_test_demo pytest
name: geoimport-test
services:
  db-test:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: geoimport_test_demo
      POSTGRES_USER: geoimport
      POSTGRES_PASSWORD: test        # nur lokale, flüchtige Testdatenbank
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${TEST_DB_PORT:-55434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoimport -d geoimport_test_demo"]
      interval: 2s
      retries: 30
