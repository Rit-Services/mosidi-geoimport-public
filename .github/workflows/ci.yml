name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: geoimport_test_demo
          POSTGRES_USER: geoimport
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoimport -d geoimport_test_demo"
          --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://geoimport:test@127.0.0.1:5432/geoimport_test_demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock && pip install -e ".[dev,webmap]"
      - name: Lint
        run: |
          ruff check geoimport webmap scripts tests
          ruff format --check .
          mypy geoimport webmap
      - name: Konfiguration prüfen
        run: python -m geoimport.cli validate-config --config-dir config
      - name: Tests (Unit, Integration, E2E mit Fixtures)
        run: pytest --cov=geoimport --cov=webmap --cov-report=term-missing --cov-fail-under=80
      - name: Lizenzübersicht aktuell und nur Open Source
        run: python scripts/gen_third_party.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t mosidi-geoimport:ci .
      - run: docker run --rm mosidi-geoimport:ci validate-config

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks (MIT) direkt, per Digest gepinnt; die GitHub-Action v2 verlangt für Organisationen einen Lizenzschlüssel
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 detect --source /repo --redact --verbose
