[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoimport"
version = "0.10.0"
description = "Konfigurierbare Import-Pipeline für Geodaten (WFS/CSV → PostgreSQL/PostGIS)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "RIT Services GmbH, Köln" }]
dependencies = [
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "psycopg[binary]>=3.2,<4",
  "pyogrio>=0.10,<1",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pandas>=2.2,<3",
  "jinja2>=3.1,<4",
  "zipfile-deflate64>=0.2,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
webmap = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-licenses>=5",
  "httpx>=0.27",
]

[project.scripts]
pipeline = "geoimport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["geoimport", "webmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: braucht eine PostGIS-Testdatenbank (TEST_DATABASE_URL)",
  "e2e: kompletter Lauf mit Fixtures gegen die Testdatenbank",
  "live: greift auf echte Dienste im Internet zu (nur make acceptance)",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:pyogrio.*"]

[tool.coverage.run]
source = ["geoimport"]
omit = ["geoimport/sources/_template.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "D1"]
ignore = ["S101", "S608", "D100", "D104", "D105", "D107", "S311", "E501"]  # Zeilenlänge hält ruff format ein

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "S", "E501"]
"geoimport/config/models.py" = ["D101"]
"scripts/**" = ["D1", "S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]
